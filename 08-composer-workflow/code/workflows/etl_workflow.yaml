main:
  params: [input]
  steps:
    - transform:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${sys.get_env("GOOGLE_CLOUD_PROJECT")}
          body:
            query: |
              SELECT COUNT(*) AS n FROM `cymbal_warehouse.taxi_trips`
            useLegacySql: false
        result: queryResult

    - notify:
        call: googleapis.logging.v2.entries.write
        args:
          entries:
            - logName: "projects/${sys.get_env('GOOGLE_CLOUD_PROJECT')}/logs/workflow"
              textPayload: "Workflow finished: ${queryResult.rows[0].f[0].v} rows"
